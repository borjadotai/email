name: macOS App

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build macOS DMG
    runs-on: macos-26
    timeout-minutes: 45

    env:
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
      EMAIL_RELEASE_SERVER_URL: ${{ vars.EMAIL_RELEASE_SERVER_URL }}
      MACOS_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 }}
      MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail

          for candidate in \
            /Applications/Xcode_26.5.app \
            /Applications/Xcode_26.4.1.app \
            /Applications/Xcode_26.4.app \
            /Applications/Xcode.app; do
            if [[ -d "$candidate" ]]; then
              sudo xcode-select -s "$candidate/Contents/Developer"
              break
            fi
          done

          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run server tests
        run: npm test

      - name: Set release version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(node -p 'require("./package.json").version')"
          fi

          echo "EMAIL_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "EMAIL_RELEASE_BUILD=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$MACOS_DEVELOPER_ID_CERTIFICATE_BASE64" || -z "$MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD" || -z "$DEVELOPER_ID_APPLICATION" ]]; then
            echo "SIGNING_ENABLED=0" >> "$GITHUB_ENV"
            echo "Developer ID signing secrets are not configured; building unsigned artifacts."
            exit 0
          fi

          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          keychain_password="$(uuidgen)"
          certificate_path="$RUNNER_TEMP/developer-id.p12"

          echo "$MACOS_DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security default-keychain -s "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security import "$certificate_path" \
            -P "$MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -A \
            -k "$keychain_path" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"

          echo "SIGNING_ENABLED=1" >> "$GITHUB_ENV"
          security find-identity -p codesigning -v

      - name: Package macOS app
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${SIGNING_ENABLED:-0}" == "1" ]]; then
            npm run package:mac
          else
            npm run package:mac -- --unsigned --skip-notarization
          fi

      - name: Download Sparkle tools
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 3 -o "$RUNNER_TEMP/Sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/2.9.2/Sparkle-2.9.2.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/Sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle" --strip-components 1
          echo "SPARKLE_SIGN_UPDATE=$RUNNER_TEMP/sparkle/bin/sign_update" >> "$GITHUB_ENV"

      - name: Write checksums
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./script/create_sparkle_appcast.sh
          fi

          files=(dist/Email-mac.dmg dist/Email-mac.zip)
          if [[ -f dist/appcast.xml ]]; then
            files+=(dist/appcast.xml)
          fi
          shasum -a 256 "${files[@]}" > dist/checksums.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Email-macOS-${{ github.sha }}
          path: |
            dist/Email-mac.dmg
            dist/Email-mac.zip
            dist/appcast.xml
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/Email-mac.dmg \
              dist/Email-mac.zip \
              dist/appcast.xml \
              dist/checksums.txt \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/Email-mac.dmg \
              dist/Email-mac.zip \
              dist/appcast.xml \
              dist/checksums.txt \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
