name: macOS App

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build macOS DMG
    runs-on: macos-15
    timeout-minutes: 45

    env:
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
      EMAIL_RELEASE_ENV_BASE64: ${{ secrets.EMAIL_RELEASE_ENV_BASE64 }}
      MACOS_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 }}
      MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run server tests
        run: npm test

      - name: Import Developer ID certificate
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$MACOS_DEVELOPER_ID_CERTIFICATE_BASE64" || -z "$MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD" || -z "$DEVELOPER_ID_APPLICATION" ]]; then
            echo "SIGNING_ENABLED=0" >> "$GITHUB_ENV"
            echo "Developer ID signing secrets are not configured; building unsigned artifacts."
            exit 0
          fi

          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          keychain_password="$(uuidgen)"
          certificate_path="$RUNNER_TEMP/developer-id.p12"

          echo "$MACOS_DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security default-keychain -s "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security import "$certificate_path" \
            -P "$MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -A \
            -k "$keychain_path" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"

          echo "SIGNING_ENABLED=1" >> "$GITHUB_ENV"
          security find-identity -p codesigning -v

      - name: Prepare release environment file
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$EMAIL_RELEASE_ENV_BASE64" ]]; then
            exit 0
          fi

          release_env_file="$RUNNER_TEMP/email-release.env"
          echo "$EMAIL_RELEASE_ENV_BASE64" | base64 --decode > "$release_env_file"
          chmod 600 "$release_env_file"
          echo "EMAIL_RELEASE_ENV_FILE=$release_env_file" >> "$GITHUB_ENV"

      - name: Package macOS app
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${SIGNING_ENABLED:-0}" == "1" ]]; then
            npm run package:mac
          else
            npm run package:mac -- --unsigned --skip-notarization
          fi

      - name: Write checksums
        run: shasum -a 256 dist/Email-mac.dmg dist/Email-mac.zip > dist/checksums.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Email-macOS-${{ github.sha }}
          path: |
            dist/Email-mac.dmg
            dist/Email-mac.zip
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/Email-mac.dmg \
              dist/Email-mac.zip \
              dist/checksums.txt \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/Email-mac.dmg \
              dist/Email-mac.zip \
              dist/checksums.txt \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
